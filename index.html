<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="創作キャラクター向け・キャラクター拳銃診断" />
  <title>キャラクター拳銃診断</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <section id="start-screen" class="screen active" aria-labelledby="start-title">
      <div class="eyebrow">CHARACTER SIDEARM TEST</div>
      <h1 id="start-title" class="start-copy">
        <span class="start-copy-line">もし</span>
      </h1>

      <label class="name-field name-field-hero">
        <span class="visually-hidden">CHARACTER NAME</span>
        <input
          id="name-input"
          type="text"
          maxlength="24"
          autocomplete="off"
          placeholder="名前を入力"
          aria-describedby="name-error"
        />
      </label>

      <p class="start-copy-tail">が拳銃を選ぶなら</p>
      <p id="name-error" class="error" aria-live="polite"></p>

      <button id="start-button" class="primary-button" type="button">START</button>

      <a class="secondary-button start-result-list-link" href="./results.html">RESULT LIST</a>
      <p class="note">創作キャラクター向けのイメージ診断です。実用・購入推奨を目的としたものではありません。</p>
    </section>

    <section id="quiz-screen" class="screen" aria-labelledby="question-title">
      <div class="quiz-top">
        <div>
          <div class="eyebrow">QUESTION</div>
<div id="progress-label" class="progress-label">01 / 12</div>
        </div>
</div>

      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <h2 id="question-title"></h2>
      <p id="question-subtitle" class="question-subtitle"></p>
      <div id="answers" class="answers" role="group" aria-label="回答"></div>
      <button id="back-button" class="text-button back-inline-button" type="button">＜戻る</button>
    </section>

    <section id="result-screen" class="screen" aria-labelledby="result-title">
      <div class="result-hero">
      <div class="eyebrow">RESULT</div>
      <p id="result-for" class="result-for"></p>
      <h2 id="result-title"></h2>
      <p id="result-title-ja" class="result-title-ja"></p>

      <figure id="result-image-figure" class="result-image-figure">
        <div class="result-image-frame">
          <img id="result-gun-image" class="result-gun-image" src="" alt="" />
        </div>
        <figcaption id="result-image-credit" class="result-image-credit"></figcaption>
      </figure>
      <div id="result-tags" class="tag-list" aria-label="特徴"></div>


      </div>

      <div class="trait-meter-card" aria-label="キャラクター傾向">
        <div class="trait-meter-title">CHARACTER PROFILE / ANSWER TENDENCY</div>
        <div id="trait-meters" class="trait-meters"></div>
      </div>

      <div class="score-card">
        <div class="score-head">
          <span>MATCH</span>
          <strong id="match-score">00%</strong>
        </div>
        <div class="match-track" aria-hidden="true">
          <div id="match-bar" class="match-bar"></div>
        </div>
      </div>

      <p id="result-copy" class="result-copy"></p>
      <p id="result-detail" class="result-detail"></p>

      <div class="result-actions">
        <button id="retry-button" class="primary-button" type="button">もう一度診断する</button>
        <button id="copy-button" class="secondary-button" type="button">結果をコピー</button>
      </div>
      <p id="copy-status" class="copy-status" aria-live="polite"></p>
    </section>
  </main>
<script src="./gun-data.js"></script>
<script src="./script.js"></script>
</body>
</html>
